[project]
name = "my-agit"
version = "0.1.0"
description = "Version control and a red/black release gate for agent harnesses"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agit = "agit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agit*"]

[tool.setuptools.package-data]
agit = ["fixtures.json"]
